name: Deploy backend (VM)

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: [self-hosted, vm-itp-prod]
    steps:
      - name: Deploy
        run: |
          set -e
          cd /home/itpadmin/aprxm_sys
          git fetch origin
          git checkout main
          git reset --hard origin/main
          cd /home/itpadmin/itp-stack
          docker compose build aprxm_backend
          docker compose up -d --force-recreate aprxm_backend
          # Espera ate 90s: migration nova roda no startup e pode atrasar o
          # boot (v29 levou >6s em 2026-09-23 -- o sleep fixo de 6s marcou
          # falha num deploy que tinha subido certo).
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8003/health > /dev/null; then
              echo "health OK apos ~$((i * 2))s"
              docker ps --filter name=aprxm_backend --format '{{.Names}} {{.Status}}'
              exit 0
            fi
            sleep 2
          done
          docker ps --filter name=aprxm_backend --format '{{.Names}} {{.Status}}'
          docker logs aprxm_backend --tail 40
          echo "health check failed apos 90s" && exit 1
